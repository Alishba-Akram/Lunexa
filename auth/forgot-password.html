
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunexa - Forgot Password</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;background:#0b1020;color:white;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:430px;background:#151e35;border:1px solid #29314d;border-radius:16px;padding:38px}
.logo{text-align:center;color:#a99aff;font-size:27px;font-weight:bold;margin-bottom:30px}
h1{text-align:center;margin-bottom:12px}
p{text-align:center;color:#929bb4;font-size:14px;line-height:1.7;margin-bottom:25px}
label{display:block;color:#c4c9dc;font-size:13px;margin-bottom:9px}
input{width:100%;padding:14px;background:#0e162b;border:1px solid #343d5b;border-radius:8px;color:white}
button{width:100%;padding:14px;background:#7966ed;color:white;border:0;border-radius:8px;margin-top:22px;font-weight:bold}
a{display:block;text-align:center;color:#a99aff;text-decoration:none;font-size:13px;margin-top:22px}
</style>
</head>
<body>
<div class="box">
<div class="logo">✦ Lunexa</div>
<h1>Forgot Password?</h1>
<p>No worries! Enter your email address below and follow the instructions to reset your password.</p>
<form action="#">
<label>Email Address</label>
<input type="email" placeholder="Enter your registered email" required>
<button type="submit">Send Reset Instructions</button>
</form>
<a href="login.html">← Back to Login</a>
</div>
</body>
</html>
