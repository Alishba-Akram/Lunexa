
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunexa - Sign Up</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;background:#0b1020;color:white;display:grid;place-items:center;padding:20px}
.signup{width:100%;max-width:470px;background:#151e35;border:1px solid #29314d;border-radius:16px;padding:35px}
.logo{text-align:center;color:#a99aff;font-size:27px;font-weight:bold;margin-bottom:25px}
h1{text-align:center;margin-bottom:10px}
p{text-align:center;color:#929bb4;font-size:14px;margin-bottom:22px}
label{display:block;color:#c4c9dc;font-size:13px;margin:15px 0 8px}
input{width:100%;padding:13px;background:#0e162b;border:1px solid #343d5b;border-radius:8px;color:white}
button{width:100%;padding:14px;background:#7966ed;color:white;border:0;border-radius:8px;margin-top:23px;font-weight:bold}
a{color:#a99aff;text-decoration:none;font-size:13px}
.bottom{text-align:center;margin-top:22px;color:#929bb4}
</style>
</head>
<body>
<div class="signup">
<div class="logo">✦ Lunexa</div>
<h1>Create Account</h1>
<p>Join Lunexa and organize your work.</p>
<form action="#">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>
<label>Password</label>
<input type="password" placeholder="Create a password" required>
<label>Confirm Password</label>
<input type="password" placeholder="Confirm your password" required>
<button type="submit">Create Account</button>
</form>
<div class="bottom">Already have an account? <a href="login.html">Sign In</a></div>
<div class="bottom"><a href="../index.html">← Back to Home</a></div>
</div>
</body>
</html>
