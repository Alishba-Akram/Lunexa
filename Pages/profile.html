
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunexa - Profile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b1020;color:white}
header{background:#10172b;padding:22px 7%}
header a{color:#a99aff;text-decoration:none}
main{max-width:850px;margin:40px auto;padding:0 20px}
.card{background:#151e35;border:1px solid #29314d;border-radius:14px;padding:28px;margin-top:25px}
.avatar{width:90px;height:90px;background:#514487;border-radius:50%;display:grid;place-items:center;font-size:28px;margin-bottom:15px}
p{color:#929bb4}
label{display:block;color:#b7bfd4;font-size:13px;margin:18px 0 8px}
input,textarea{width:100%;background:#0e162b;border:1px solid #343d5b;padding:13px;border-radius:8px;color:white}
textarea{height:90px}
button{margin-top:20px;background:#7966ed;color:white;border:0;border-radius:8px;padding:13px 22px}
</style>
</head>
<body>
<header><a href="../index.html">✦ LUNEXA</a></header>
<main>
<h1>My Profile</h1>
<p style="margin-top:8px">Manage your personal information.</p>
<div class="card">
<div class="avatar">AA</div>
<h2>Alishba Akram</h2>
<p style="margin-top:8px">Project Manager</p>
</div>
<div class="card">
<h3>Personal Information</h3>
<form action="#">
<label>Full Name</label>
<input type="text" value="Alishba Akram">
<label>Email Address</label>
<input type="email" value="alishba@example.com">
<label>Phone Number</label>
<input type="tel" placeholder="Enter phone number">
<label>Job Title</label>
<input type="text" value="Project Manager">
<label>About Me</label>
<textarea placeholder="Write something about yourself..."></textarea>
<button type="submit">Save Changes</button>
</form>
</div>
</main>
</body>
</html>
